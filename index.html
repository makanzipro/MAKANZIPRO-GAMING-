
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100020">
<title>MAKANZIPRO GAMING</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090012;color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;padding:35px 15px 28px;
 background:linear-gradient(135deg,#5800a8,#160027,#08000f);
 border-bottom:2px solid #a020f0;
}
.logo{font-size:13px;letter-spacing:5px;color:#d9a5ff}
h1{font-size:27px;color:#e3b5ff;text-shadow:0 0 15px #a020f0}
header p{color:#d7c6e5}
nav{
 display:flex;flex-wrap:wrap;justify-content:center;
 gap:9px;padding:17px 10px;
}
button{
 border:1px solid #a020f0;background:#25003d;
 color:white;padding:12px 15px;border-radius:10px;
 font-weight:bold;cursor:pointer;
}
button.active,button:hover{background:#8200cc}
.search{
 display:block;width:90%;max-width:500px;
 margin:5px auto 20px;padding:14px;
 border-radius:12px;border:1px solid #a020f0;
 background:#190027;color:white;font-size:15px;
}
h2{text-align:center;color:#d9a5ff}
#games{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;padding:14px;max-width:1000px;margin:auto;
}
.card{
 background:#190027;border:1px solid #7020a0;
 border-radius:14px;overflow:hidden;text-align:center;
 box-shadow:0 0 10px #39005c;
}
.cover{
 height:145px;display:flex;align-items:center;
 justify-content:center;flex-direction:column;
 background:linear-gradient(145deg,#6200a5,#170025);
 font-size:48px;
}
.cover small{font-size:11px;letter-spacing:2px;color:#e4c5ff}
.card h3{font-size:14px;padding:0 7px;min-height:34px}
.tag{font-size:11px;color:#d5a2ff}
.card button{margin:5px 5px 14px;font-size:11px}
.card button:disabled{opacity:.7;cursor:not-allowed}
.empty{text-align:center;color:#c9a8df;padding:30px}
footer{
 text-align:center;padding:28px;color:#9d83b2;
 border-top:1px solid #410066;margin-top:25px;
}
@media(min-width:650px){
 #games{grid-template-columns:repeat(3,1fr)}
 h1{font-size:36px}
}
</style>
</head>

<body>

<header>
 <div class="logo">WELCOME TO</div>
 <h1>MAKANZIPRO GAMING</h1>
 <p>TON UNIVERS DE JEUX 🎮</p>
 <p>PLAY • COMPETE • ENJOY</p>
</header>

<nav id="filters">
 <button class="active" data-cat="TOUS">TOUS</button>
 <button data-cat="PSP">PSP</button>
 <button data-cat="PS2">PS2</button>
 <button data-cat="PS3">PS3</button>
 <button data-cat="APK">APK MODIFIÉS</button>
</nav>

<input class="search" id="search"
 placeholder="🔎 Rechercher un jeu...">

<h2>🔥 CATALOGUE DES JEUX</h2>

<div id="games"></div>

<footer>
 <p>MAKANZIPRO GAMING</p>
 <p>© 2026 • Tous droits réservés</p>
</footer>

<script>
const jeux=[
 {nom:"God of War: Ghost of Sparta",cat:"PSP",emoji:"⚔️"},
 {nom:"LEGO Batman",cat:"PSP",emoji:"🦇"},
 {nom:"Cars",cat:"PSP",emoji:"🏎️"},
 {nom:"GTA Vice City Stories",cat:"PSP",emoji:"🚘"},
 {nom:"Downhill Domination",cat:"PS2",emoji:"🚵"},
 {nom:"Resident Evil 4",cat:"PS2",emoji:"🎮"},
 {nom:"PS2 Football",cat:"PS2",emoji:"⚽"},
 {nom:"Jeux à ajouter",cat:"PS3",emoji:"🎮"},
 {nom:"eFootball ZIRU 27",cat:"APK",emoji:"⚽"},
 {nom:"Kipas Football",cat:"APK",emoji:"🏆"}
];

let categorie="TOUS";

function afficher(){
 const recherche=document.getElementById("search").value.toLowerCase();
 const zone=document.getElementById("games");
 zone.innerHTML="";

 const resultat=jeux.filter(j=>
  (categorie==="TOUS"||j.cat===categorie)&&
  j.nom.toLowerCase().includes(recherche)
 );

 if(resultat.length===0){
  zone.innerHTML='<div class="empty">Aucun jeu trouvé.</div>';
  return;
 }

 resultat.forEach(j=>{
  const carte=document.createElement("article");
  carte.className="card";

  const couverture=document.createElement("div");
  couverture.className="cover";
  couverture.textContent=j.emoji;

  const etiquette=document.createElement("small");
  etiquette.textContent="MAKANZIPRO";
  couverture.appendChild(etiquette);

  const titre=document.createElement("h3");
  titre.textContent=j.nom;

  const type=document.createElement("p");
  type.className="tag";
  type.textContent=j.cat;

  const bouton=document.createElement("button");
  bouton.textContent="LIEN À AJOUTER";
  bouton.disabled=true;

  carte.append(couverture,titre,type,bouton);
  zone.appendChild(carte);
 });
}

document.querySelectorAll("#filters button").forEach(b=>{
 b.addEventListener("click",()=>{
  categorie=b.dataset.cat;
  document.querySelectorAll("#filters button")
   .forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  afficher();
 });
});

document.getElementById("search")
 .addEventListener("input",afficher);

afficher();
</script>

</body>
</html>
