
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100b20">
<title>MAKANZIPRO GAMING</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0814;color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;padding:30px 15px;
 background:linear-gradient(135deg,#180d35,#45108a,#100b20);
 border-bottom:2px solid #a855f7;
}
header h1{color:#d8a7ff;font-size:30px;margin:5px}
header p{color:#ddd}
.logo{font-size:42px}
.search{
 display:block;width:90%;max-width:500px;
 margin:22px auto;padding:14px;
 border-radius:12px;border:1px solid #9b4dff;
 background:#171126;color:white;font-size:16px;
}
.categories{
 display:flex;justify-content:center;flex-wrap:wrap;
 gap:9px;padding:10px;
}
.categories button{
 background:#211436;color:white;border:1px solid #914cff;
 padding:11px 16px;border-radius:20px;
}
.categories button.active,.categories button:hover{
 background:#8b35e8;
}
h2{text-align:center;color:#d8a7ff}
.catalogue{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:15px;padding:15px;max-width:1000px;margin:auto;
}
.card{
 background:#191326;border:1px solid #57328a;
 border-radius:15px;overflow:hidden;text-align:center;
 padding-bottom:15px;
}
.cover{
 height:120px;display:flex;align-items:center;
 justify-content:center;font-size:55px;
 background:linear-gradient(135deg,#34145b,#100b20);
}
.card h3{font-size:16px;padding:0 8px;min-height:38px}
.card p{color:#c4b5d8;font-size:13px}
.card a{
 display:inline-block;text-decoration:none;
 background:#8b35e8;color:white;
 padding:10px 13px;border-radius:9px;
 font-size:13px;font-weight:bold;
}
.card a:hover{background:#a855f7}
.empty{text-align:center;color:#bba9d0;padding:25px}
footer{
 text-align:center;padding:25px;color:#aaa;
 border-top:1px solid #392451;margin-top:30px;
}
</style>
</head>
<body>

<header>
 <div class="logo">🎮</div>
 <h1>MAKANZIPRO GAMING</h1>
 <p>TON UNIVERS GAMING COMMENCE ICI</p>
</header>

<input class="search" id="search"
 placeholder="🔎 Rechercher un jeu..."
 oninput="afficher()">

<nav class="categories">
 <button class="active" onclick="filtrer('TOUS',this)">TOUS</button>
 <button onclick="filtrer('PSP',this)">PSP</button>
 <button onclick="filtrer('PS2',this)">PS2</button>
 <button onclick="filtrer('PS3',this)">PS3</button>
 <button onclick="filtrer('APK',this)">APK MODIFIÉS</button>
</nav>

<h2>🔥 CATALOGUE DES JEUX</h2>
<main class="catalogue" id="catalogue"></main>

<footer>
 <h3>MAKANZIPRO GAMING</h3>
 <p>© 2026 - Tous droits réservés</p>
 <p>Play • Compete • Enjoy</p>
</footer>

<script>
const jeux = [
 {
  nom:"God of War: Ghost of Sparta",
  categorie:"PSP",image:"⚔️",
  lien:"https://www.romspedia.com/roms/playstation-portable/god-of-war-ghost-of-sparta-original/download?speed=fast"
 },
 {
  nom:"LEGO Batman",
  categorie:"PSP",image:"🦇",
  lien:"https://www.romspedia.com/roms/playstation-portable/lego-batman-the-video-game/download?speed=fast"
 },
 {
  nom:"Cars",
  categorie:"PSP",image:"🏎️",
  lien:"https://www.romspedia.com/roms/playstation-portable/cars-v1-02/download?speed=fast"
 },
 {
  nom:"GTA Vice City Stories",
  categorie:"PSP",image:"🚗",
  lien:"https://www.romspedia.com/roms/playstation-portable/grand-theft-auto-vice-city-stories-europe-v1-02/download?speed=fast"
 },
 {
  nom:"PS2 Football",
  categorie:"PS2",image:"⚽",
  lien:"https://modsfire.com/d/WpRB05ZE84Ma2D1"
 },
 {
  nom:"Downhill Domination",
  categorie:"PS2",image:"🚴",
  lien:"https://www.romspedia.com/roms/playstation-2/downhill-domination/download?speed=fast"
 },
 {
  nom:"Resident Evil 4",
  categorie:"PS2",image:"🎮",
  lien:"https://www.romspedia.com/roms/playstation-2/resident-evil-4/download?speed=fast"
 }
];

let categorieActive="TOUS";

function filtrer(categorie, bouton){
 categorieActive=categorie;
 document.querySelectorAll(".categories button")
 .forEach(b=>b.classList.remove("active"));
 bouton.classList.add("active");
 afficher();
}

function afficher(){
 const recherche=document.getElementById("search")
 .value.toLowerCase();

 const liste=jeux.filter(jeu=>{
  return (categorieActive==="TOUS" ||
  jeu.categorie===categorieActive) &&
  jeu.nom.toLowerCase().includes(recherche);
 });

 const catalogue=document.getElementById("catalogue");

 if(liste.length===0){
  catalogue.innerHTML='<p class="empty">Aucun jeu trouvé.</p>';
  return;
 }

 catalogue.innerHTML=liste.map(jeu=>`
  <article class="card">
   <div class="cover">${jeu.image}</div>
   <h3>${jeu.nom}</h3>
   <p>${jeu.categorie}</p>
   <a href="${jeu.lien}" target="_blank"
   rel="noopener noreferrer">VOIR LE LIEN</a>
  </article>
 `).join("");
}

afficher();
</script>
</body>
</html>
